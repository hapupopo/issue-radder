<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><script>window.PP_SNAPSHOT={"asOf": "2026-11-10", "data": {"env": {"env-01": {"area": "정책·예산", "end": "27-Q2", "impact": "기회", "implication": "신규과제가 많다는 것은 내년 1분기 공고 전에 과제 내용을 미리 협의할 기회가 크다는 뜻입니다.", "issue": "2027년 정부 R&D 신규과제 예산이 3.3조원으로 역대 최대이고, 바이오는 합성생물학·AI 융합 중심으로 늘어날 예정", "ministry": "과학기술정보통신부", "order": 1, "problem": "공고가 나온 뒤에 대응하면 과제 범위가 회사 기술 로드맵과 맞지 않거나 준비 기간이 부족함", "solution": "사업부 기술 수요를 먼저 정리해 과기정통부·전담기관 기획 단계(26.12~27.1)에 전달하고, 공고 전에 컨소시엄 구성", "sources": [{"t": "금융경제플러스", "u": "https://www.kndaily.co.kr/news/articleView.html?idxno=310898"}, {"t": "아시아경제", "u": "https://view.asiae.co.kr/article/2026083113534481336"}], "start": "26-11", "summary": "정부가 2027년 R&D 예산안을 39.5조원(전년 대비 11.2% 증가)으로 편성했고, 신규과제 예산은 3.3조원으로 역대 최대입니다. 첨단바이오는 미래성장 분야로 유지되며 AI-바이오 융합과 합성생물학 투자를 늘리는 방향입니다. 국회 심사 중이라 금액은 바뀔 수 있습니다.", "taskTitle": "2027 신규 정부 R&D 과제 사전기획 (바이오 분야)", "taskType": "R&D 과제 기획", "timing": "26.11~12 국회 심사 → 27.1분기 신규과제 공고", "title": "2027년 정부 R&D 39.5조원, 신규과제 예산 역대 최대"}, "env-02": {"area": "법·제도", "end": "27-Q1", "impact": "기회", "implication": "기본계획이 확정되기 직전인 지금이 산업계 수요(실증·스케일업 설비, 데이터 공유)를 반영할 수 있는 시점입니다.", "issue": "합성생물학 육성법 시행으로 첫 5년 기본계획과 공공 바이오파운드리 운영 방안이 연내 확정 예정", "ministry": "과학기술정보통신부", "order": 2, "problem": "계획이 연구 중심으로만 짜이면 기업에 필요한 대량생산 실증·스케일업 지원이 빠질 수 있음", "solution": "바이오 제조 실증과 파운드리 공동 활용 방안을 업계 의견으로 정리해 과기정통부·실무위원회에 제출", "sources": [{"t": "헬로디디", "u": "https://www.hellodd.com/news/articleView.html?idxno=111573"}], "start": "26-11", "summary": "「합성생물학 육성법」이 2026년 4월 23일 시행됐습니다. 5년 단위 기본계획, 부처 합동 실무위원회, 공공 바이오파운드리(AI 자동화 실험시설) 지정·지원 근거가 생겼고 <script>
(function(){
const PERIODS=[
  {k:"26-11",l:"26.11월",y:26},{k:"26-12",l:"26.12월",y:26},
  {k:"27-Q1",l:"27.1분기",y:27},{k:"27-Q2",l:"27.2분기",y:27},{k:"27-Q3",l:"27.3분기",y:27},{k:"27-Q4",l:"27.4분기",y:27}];
const PI=Object.fromEntries(PERIODS.map((p,i)=>[p.k,i]));
const TYPES=["정책 반영","규제 합리화","R&D 과제 기획","현안 대응","대정부 네트워크"];
const TYPE_HELP={"정책 반영":"정부 계획·전략에 회사에 도움 되는 내용이 들어가도록 협의","규제 합리화":"사업을 가로막는 규제를 합리적으로 고치도록 건의","R&D 과제 기획":"정부 연구과제를 미리 함께 기획해 회사 R&D와 연결","현안 대응":"갑자기 생긴 이슈(법안, 감사, 언론 등)에 대응","대정부 네트워크":"부처·기관과의 정기 소통 채널 관리"};
const STATUS=["발굴","검토","추진","완료","보류"];
const PRIO=["상","중","하"];
const SOURCES=["대외환경","지원사업","중장기 전략","조직 인터뷰","팀 자체 발굴"];
const AREAS=["정책·예산","법·제도","규제","공정거래·물가","통상·수출","ESG·환경"];
const IMPACT_CLS={"기회":"s-완료","위협":"p-상","양면":"s-검토"};
const FITS=["높음","보통","낮음","해당 없음"];
const MINISTRIES=["농림축산식품부","식품의약품안전처","산업통상자원부","기획예산처","재정경제부","과학기술정보통신부","기후에너지환경부","해양수산부","보건복지부","중소벤처기업부","국무조정실","국회"];
const GOV=[ // 정부 연간 일정 (일반적인 흐름, 매년 확인 필요)
  {k:"26-11",t:"국회 예산 심사",d:"상임위·예결위 증액 논의"},
  {k:"26-12",t:"예산 확정 · 업무계획 준비",d:"12.2 법정 의결기한"},
  {k:"27-Q1",t:"부처 업무계획 발표",d:"신규 R&D 공고 집중"},
  {k:"27-Q2",t:"28년 예산 요구",d:"5월 말 부처 요구안 제출"},
  {k:"27-Q3",t:"정부 예산안 확정",d:"9월 초 국회 제출"},
  {k:"27-Q4",t:"국정감사 · 국회 심사",d:"10월 국감, 11월 예산 심사"}];

let db=null, sample=null, tasks=[], insights=[], env=[], pillars=[], loaded={t:false,i:false};
let drafts={}, envAI="", envBusy=false, programs=[];
let tab="overview", filt={period:"",type:"",status:"",q:""}, candidates=[], aiBusy=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nl=s=>esc(s).replace(/\n/g,"<br>");
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

/* ---------- tabs ---------- */
const VALID=["overview","env","programs","tasks","insights","roadmap","report"];
function setTab(t){tab=VALID.includes(t)?t:"overview";document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));render()}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b){location.hash=b.dataset.tab;setTab(b.dataset.tab)}});
window.addEventListener("hashchange",()=>setTab(location.hash.slice(1)));
$("#addTaskTop").onclick=()=>openTask();

/* ---------- helpers ---------- */
const chip=(cls,t)=>`<span class="chip ${cls}">${esc(t)}</span>`;
const sChip=s=>chip("s-"+s,s), pChip=p=>chip("p-"+p,"우선 "+p);
const exTag=o=>o.example?' <span class="ex">예시</span>':"";
const periodLabel=t=>{const a=PERIODS[PI[t.start]],b=PERIODS[PI[t.end]];if(!a)return"-";return a.k===b?.k||!b?a.l:a.l+" ~ "+b.l};
const inPeriod=(t,k)=>PI[t.start]<=PI[k]&&PI[k]<=PI[t.end];
function sorted(list){return [...list].sort((a,b)=>(PRIO.indexOf(a.priority)-PRIO.indexOf(b.priority))||((PI[a.start]??9)-(PI[b.start]??9))||String(a.title).localeCompare(b.title))}
function frame(o){return `<div class="frame"><div><div class="k">현안</div>${nl(o.issue)||'<span class="muted">-</span>'}</div><div><div class="k">문제점</div>${nl(o.problem)||'<span class="muted">-</span>'}</div><div><div class="k">대안</div>${nl(o.solution)||'<span class="muted">-</span>'}</div></div>`}

/* ---------- render ---------- */
function render(){
  const v=$("#view");
  if(!db&&!(loaded.t&&loaded.i)){v.innerHTML=`<div class="empty">데이터 저장소에 연결하는 중입니다. 로그인 상태에서 열면 팀 과제와 인사이트가 여기에 표시됩니다.</div>`;return}
  ({overview:rOverview,env:rEnv,programs:rPrograms,tasks:rTasks,insights:rInsights,roadmap:rRoadmap,report:rReport})[tab](v);
}

function rOverview(v){
  const act=tasks.filter(t=>t.status!=="완료"&&t.status!=="보류");
  const n26=tasks.filter(t=>PI[t.start]<=1).length, n27=tasks.filter(t=>PI[t.end]>=2).length;
  const openIns=insights.filter(i=>!i.taskId).length;
  const byType=TYPES.map(ty=>[ty,tasks.filter(t=>t.type===ty).length]);
  const max=Math.max(1,...byType.map(x=>x[1]));
  const upcoming=sorted(act).filter(t=>t.nextDate).sort((a,b)=>a.nextDate.localeCompare(b.nextDate)).slice(0,6);
  const high=sorted(act.filter(t=>t.priority==="상")).slice(0,4);
  v.innerHTML=`
  <div class="grid g4">
    <div class="panel stat"><div class="l">진행 중 과제</div><div class="n">${act.length}</div><div class="sub">전체 ${tasks.length}건 중 완료·보류 제외</div></div>

/* 전략 매칭 블록: 대외환경·지원사업 공용 */
function matchBlock(e,coll){const m=e.match||{};const dv=(f,saved)=>drafts[e.id+":"+f]??saved??"";
  return `<div class="match">
    <select id="mp_${e.id}" data-d="${e.id}:pillar" aria-label="관련 전략 방향"><option value="">관련 전략 방향 선택</option>${opt(pillars,dv("pillar",m.pillar))}</select>
    <select id="mf_${e.id}" data-d="${e.id}:fit" aria-label="연관도"><option value="">연관도</option>${opt(FITS,dv("fit",m.fit))}</select>
    <textarea id="mo_${e.id}" data-d="${e.id}:opinion" placeholder="${coll==="programs"?"의견 (예: OO사업부 수요기업으로 참여 검토, 협력사 연계 가능)":"의견 (예: 중장기 전략 OO 목표와 직결, 2027 상반기 우선 추진 필요)"}">${esc(dv("opinion",m.opinion))}</textarea>
    <div class="act"><div class="row">${e.taskId?`<span class="chip s-완료">과제로 등록됨</span>`:`<button class="btn" data-mtask="${e.id}">과제로 등록</button>`}</div><div class="row"><span class="small muted" id="ms_${e.id}">${m.at?"의견 저장됨":""}</span><button class="btn primary" data-msave="${e.id}">의견 저장</button></div></div>
  </div>`}
function bindMatch(v,list,coll){
  v.querySelectorAll("[data-d]").forEach(el=>{const h=()=>{drafts[el.dataset.d]=el.value};el.addEventListener("input",h);el.addEventListener("change",h)});
  v.querySelectorAll("[data-msave]").forEach(b=>b.onclick=async()=>{const id=b.dataset.msave;const g=f=>$("#m"+f+"_"+id).value.trim();
    const match={pillar:g("p"),fit:g("f"),opinion:g("o"),at:new Date().toISOString()};
    if(!match.fit&&!match.pillar&&!match.opinion){toast("전략 방향, 연관도, 의견 중 하나 이상 입력하세요.");return}
    $("#ms_"+id).textContent="저장 중…";
    try{await db.collection(coll).doc(id).update({match});["pillar","fit","opinion"].forEach(f=>delete drafts[id+":"+f]);toast("의견을 저장했습니다")}catch(err){$("#ms_"+id).textContent=err?.code==="invalid_argument"?"저장 권한이 없습니다.":"저장하지 못했습니다."}});
  v.querySelectorAll("[data-mtask]").forEach(b=>b.onclick=()=>{const e=list.find(x=>x.id===b.dataset.mtask);const fit=e.match?.fit;
    openTask({title:e.taskTitle||e.title||e.name,type:TYPES.includes(e.taskType)?e.taskType:"정책 반영",ministry:e.ministry||"",source:coll==="programs"?"지원사업":"대외환경",issue:e.issue||e.summary||"",problem:e.problem||"",solution:e.solution||e.action||"",priority:fit==="높음"?"상":fit==="낮음"?"하":"중",status:"발굴",start:e.start||"26-11",end:e.end||"27-Q4",memo:e.match?.opinion?("[전략 매칭] "+(e.match.pillar||"")+" / "+(e.match.fit||"")+"\n"+e.match.opinion):"",fromColl:coll,fromEnv:e.id})});
}

async function runEnvAI(){
  const rev=env.filter(e=>e.match?.fit);if(!sample||!rev.length)return;
  envBusy=true;render();
  const data=env.map(e=>({이슈:e.title,분야:e.area,영향:e.impact,시기:e.timing,부처:e.ministry,요약:e.summary,전략방향:e.match?.pillar||"",연관도:e.match?.fit||"미검토",의견:e.match?.opinion||"",과제등록:!!e.taskId}));
  const prompt=`당신은 식품·바이오 기업 대외협력팀(정부 중앙부처 대응)의 전략 분석을 돕습니다. 아래는 대외환경 이슈 목록과, 담당 부장이 각 이슈를 회사 중장기 전략(2027~2029) 방향에 매칭하고 남긴 의견입니다.
회사 전략 방향 목록: ${JSON.stringify(pillars)}
이를 바탕으로 경영진이 바로 이해할 쉬운 말로 분석 초안을 쓰세요. 전문용어는 풀어 쓰고, 입력에 없는 사실이나 수치는 만들지 마세요. 담당자 의견을 가장 중요한 근거로 삼으세요.
형식(일반 텍스트, 마크다운 기호 없이, 각 제목 앞에 ■):
■ 한 줄 결론
■ 전략 방향별 대외환경 연결 (방향마다 연결된 이슈와 의미 1~2문장)
■ 우선 추진 과제 3개 (각각 현안 / 문제점 / 대안 한 줄씩, 왜 지금인지)
■ 전략 공백과 리스크 (연결 이슈가 없는 방향, 위협 이슈 중 대응이 약한 것)
■ 다음 단계 (11~12월, 2027년 1분기로 나눠서)
입력:
${JSON.stringify(data)}`;
  try{const r=await sample(prompt,{modelTier:"default",onText:({text})=>{envAI=text;const o=document.querySelector(".aiout");if(o)o.textContent=text;else render()}});envAI=r.text}
  catch(e){toast(e?.code==="rate_limited"?"요청이 많아 잠시 후 다시 시도하세요.":"분석을 하지 못했습니다.")}
  envBusy=false;render();
}

async function runAI(){
  const open=insights.filter(i=>!i.taskId);if(!sample||!open.length)return;
  aiBusy=true;render();
  const data=open.map(i=>({id:i.id,source:i.source,org:i.org,pillar:i.pillar,need:i.need,govLink:i.govLink,ministry:i.ministry}));
  const prompt=`당신은 식품·바이오 기업 대외협력(정부 중앙부처 대응) 담당자를 돕습니다. 아래는 전사 중장기 전략과 조직별 인터뷰에서 모은 '정부 협력이 필요한 요청' 목록입니다.
비슷한 요청은 묶어서, 정책협력팀이 2027년에 추진할 과제 후보 3~6개로 정리하세요.
각 과제는 현안(무슨 일이 있는지) - 문제점(왜 회사에 걸림돌인지) - 대안(정부와 무엇을 어떻게 협의할지) 구조로, 경영진이 바로 이해할 쉬운 말로 1~2문장씩 쓰세요. 부처명은 입력에 있는 것만 쓰고 모르면 빈칸으로 두세요. 사실을 지어내지 마세요.
type은 반드시 다음 중 하나: ${TYPES.join(", ")}. priority는 상/중/하 중 하나.
JSON 배열만 출력: [{"title":"","type":"","ministry":"","issue":"","problem":"","solution":"","priority":"","why":"이 후보를 묶은 근거 한 문장","insightIds":["입력 id"]}]
입력:
${JSON.stringify(data)}`;
  try{const r=await sample.json(prompt,{modelTier:"default"});candidates=Array.isArray(r)?r.filter(c=>c&&c.title).map(c=>({...c,type:TYPES.includes(c.type)?c.type:"정책 반영",priority:PRIO.includes(c.priority)?c.priority:"중"})):[];if(!candidates.length)toast("후보를 만들지 못했습니다. 인사이트를 조금 더 기록한 뒤 다시 시도하세요.")}
  catch(e){toast(e?.code==="rate_limited"?"요청이 많아 잠시 후 다시 시도하세요.":"AI 정리를 하지 못했습니다.")}
  aiBusy=false;render();
}

function rRoadmap(v){
  const groups=TYPES.map(ty=>[ty,sorted(tasks.filter(t=>t.type===ty&&t.status!=="보류"))]).filter(g=>g[1].length);
  const head=`<div class="hd">과제</div>${PERIODS.map(p=>`<div class="hd ${p.y===26?"yr26":""}">${p.l}</div>`).join("")}`;
  const gov=`<div class="lab">정부 일정 기준선<small>매년 일반적인 흐름, 확인 필요</small></div>${GOV.map(g=>`<div class="gov"><b>${esc(g.t)}</b>${esc(g.d)}</div>`).join("")}`;
  const pr=programs.filter(p=>PI[p.due]!=null);
  const prow=pr.length?`<div class="lab">지원사업 공고 (예상)<small>지원사업 화면 기준, 공고문 확인 필요</small></div>${PERIODS.map(p=>`<div class="gov">${pr.filter(x=>x.due===p.k).map(x=>`<b style="font-weight:500">· ${esc(x.short||x.name)}</b>`).join("")}</div>`).join("")}`:"";
  const rows=prow+groups.map(([ty,ts])=>`<div class="sec">${esc(ty)}</div>${ts.map(t=>{const a=PI[t.start]??0,b=PI[t.end]??a;return `<div class="lab" data-task="${t.id}">${esc(t.title)}${t.example?' <span class="ex">예시</span>':""}<small>${esc(t.ministry||"")} · ${t.status}</small></div>${PERIODS.map((p,i)=>i>=a&&i<=b?`<div class="seg ${i===a?"first":""} ${i===b?"last":""}"><span style="${t.status==="완료"?"background:var(--ok)":t.status==="발굴"?"background:var(--info)":t.status==="검토"?"background:var(--warn)":""}"></span></div>`:`<div></div>`).join("")}`}).join("")}`).join("");
  v.innerHTML=`<div class="row spread" style="margin-bottom:10px"><h2>로드맵</h2><span class="small muted"><span class="chip s-발굴">발굴</span> <span class="chip s-검토">검토</span> <span class="chip s-추진">추진</span> <span class="chip s-완료">완료</span></span></div>
  <div class="tablebox"><div class="rm">${head}${gov}${rows||`<div style="grid-column:1/-1" class="empty">과제를 등록하면 기간에 맞춰 막대로 표시됩니다.</div>`}</div></div>
  <p class="small muted">정부 일정에 맞춰 과제를 배치하면 '언제 부처에 말해야 반영되는지'가 보입니다. 예: 2028년 예산에 반영하려면 2027년 2분기 부처 예산 요구 전에 협의를 끝내야 합니다.</p>`;
  bindCommon(v);
}

function rReport(v){
  const sel=sorted(tasks.filter(t=>t.status!=="보류"&&t.status!=="완료"&&(t.priority==="상"||t.status==="추진")));
  const cnt=s=>tasks.filter(t=>t.status===s).length;
  const today=new Date().toISOString().slice(0,10);
  const html=`<div class="report" id="rep">
    <div class="eyebrow">정책협력팀 · ${today} 기준</div>
    <h2 style="margin-top:4px">2026년 잔여기간 및 2027년 대정부 협력 주요 과제</h2>
    <p><b>요약</b> 전체 과제 ${tasks.length}건 (발굴 ${cnt("발굴")} · 검토 ${cnt("검토")} · 추진 ${cnt("추진")} · 완료 ${cnt("완료")}). 이 중 우선 추진하거나 진행 중인 ${sel.length}건을 보고드립니다. 각 과제는 '현안 → 문제점 → 대안' 순서로 정리했습니다.</p>
    ${sel.map((t,i)=>`<div class="item"><div class="row"><b>${i+1}. ${esc(t.title)}</b>${exTag(t)}<span class="tag">${esc(t.type)}</span><span class="tag">${esc(t.ministry||"-")}</span><span class="small muted">${periodLabel(t)}</span></div>${frame(t)}${t.expected?`<div class="small" style="margin-top:6px"><b>기대 효과</b> ${esc(t.expected)}</div>`:""}</div>`).join("")||`<div class="empty">우선순위 '상'이거나 '추진' 상태인 과제가 생기면 보고서에 들어갑니다.</div>`}
  </div>`;
  v.innerHTML=`<div class="row spread" style="margin-bottom:10px"><h2>경영진 보고</h2><button class="btn primary" id="copyRep">보고서 텍스트 복사</button></div><p class="small muted" style="margin-top:0">우선순위 '상' 또는 '추진' 상태 과제만 자동으로 모읍니다. 복사해서 보고서 양식에 붙여 쓰세요.</p>${html}`;
  $("#copyRep").onclick=()=>{
    const txt=`[2026년 잔여기간 및 2027년 대정부 협력 주요 과제] (${today} 기준)\n\n요약: 전체 ${tasks.length}건 중 우선·진행 과제 ${sel.length}건\n\n`+sel.map((t,i)=>`${i+1}. ${t.title} (${t.type} / ${t.ministry||"-"} / ${periodLabel(t)})\n - 현안: ${t.issue||"-"}\n - 문제점: ${t.problem||"-"}\n - 대안: ${t.solution||"-"}${t.expected?"\n - 기대효과: "+t.expected:""}`).join("\n\n");
    navigator.clipboard.writeText(txt).then(()=>toast("복사했습니다")).catch(()=>{const r=document.createRange();r.selectNodeContents($("#rep"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("보고서 영역을 선택했습니다. 직접 복사하세요.")})};
  bindCommon(v);
}

function bindCommon(v){
  v.querySelectorAll("[data-task]").forEach(el=>el.onclick=()=>openTask(tasks.find(t=>t.id===el.dataset.task)));
  v.querySelectorAll("[data-go]").forEach(el=>el.onclick=()=>{location.hash=el.dataset.go;setTab(el.dataset.go)});
  v.querySelectorAll("[data-new]").forEach(el=>el.onclick=()=>openTask());
}

  </form>`);
  $("#mClose").onclick=closeModal;
  const del=$("#mDel");if(del)del.onclick=()=>{if(del.dataset.armed){db.collection("tasks").doc(t.id).delete().then(()=>{closeModal();toast("삭제했습니다")}).catch(()=>toast("삭제하지 못했습니다"))}else{del.dataset.armed=1;del.textContent="한 번 더 누르면 삭제"}};
  $("#tf").onsubmit=async e=>{e.preventDefault();
    const F=["title","type","ministry","source","status","priority","owner","start","end","issue","problem","solution","expected","nextAction","nextDate","memo"];
    const d={};F.forEach(k=>d[k]=$("#f_"+k).value.trim());
    if(PI[d.end]<PI[d.start])d.end=d.start;
    d.example=!!t.example&&!isNew; d.updatedAt=new Date().toISOString(); if(isNew)d.createdAt=d.updatedAt; else d.createdAt=t.createdAt||d.updatedAt;
    if(t.fromIns)d.insightId=t.fromIns; else if(t.insightId)d.insightId=t.insightId;
    if(t.fromEnv)d.envId=t.fromEnv; else if(t.envId)d.envId=t.envId;
    $("#mMsg").textContent="저장 중…";
    try{const ref=isNew?db.collection("tasks").doc():db.collection("tasks").doc(t.id);await ref.set(d);
      if(isNew&&t.fromIns){const ids=(t.candIx!=null&&candidates[t.candIx]?.insightIds)||[t.fromIns];for(const iid of ids){if(insights.some(i=>i.id===iid))await db.collection("insights").doc(iid).update({taskId:ref.id})}}
      if(isNew&&t.fromEnv){const c=t.fromColl||"env";if((c==="env"?env:programs).some(e=>e.id===t.fromEnv))await db.collection(c).doc(t.fromEnv).update({taskId:ref.id})}
      if(t.candIx!=null){candidates.splice(t.candIx,1)}
      closeModal();toast("저장했습니다");render()}
    catch(err){$("#mMsg").textContent=err?.code==="invalid_argument"?"저장 권한이 없습니다.":"저장하지 못했습니다. 다시 시도하세요."}
  };
}

function openIns(i){
  const isNew=!i; i=i||{source:"조직 인터뷰",urgency:"중"};
  modal(`<div class="row spread"><h2>${isNew?"인사이트 기록":"인사이트 수정"}${exTag(i)}</h2><button class="btn ghost" id="mClose">닫기</button></div>
  <form class="form" id="inf">
    <label>출처<select id="i_source">${opt(SOURCES,i.source)}</select></label>
    <label>조직·부서<input id="i_org" value="${esc(i.org)}" placeholder="예: 바이오사업부문"></label>
    <label>관련 전략 방향<input id="i_pillar" value="${esc(i.pillar)}" placeholder="예: 그린바이오 신사업"></label>
    <label>시급도<select id="i_urgency">${opt(PRIO,i.urgency)}</select></label>
    <label class="full">요청·현안 내용<textarea id="i_need" required>${esc(i.need)}</textarea></label>
    <label class="full">정부 연계 포인트 (어떤 정책·사업과 이어질 수 있나)<textarea id="i_govLink">${esc(i.govLink)}</textarea></label>
    <label>관련 부처<input id="i_ministry" list="mins2" value="${esc(i.ministry)}"><datalist id="mins2">${MINISTRIES.map(m=>`<option value="${m}">`).join("")}</datalist></label>
    <label>기록일<input id="i_date" type="date" value="${esc(i.date||new Date().toISOString().slice(0,10))}"></label>
    <div class="full row spread">${isNew?"<span></span>":`<button type="button" class="btn" id="mDel" style="color:var(--bad)">삭제</button>`}<div class="row"><span class="small muted" id="mMsg"></span><button class="btn primary" type="submit">저장</button></div></div>
  </form>`);
  $("#mClose").onclick=closeModal;
  const del=$("#mDel");if(del)del.onclick=()=>{if(del.dataset.armed){db.collection("insights").doc(i.id).delete().then(()=>{closeModal();toast("삭제했습니다")}).catch(()=>toast("삭제하지 못했습니다"))}else{del.dataset.armed=1;del.textContent="한 번 더 누르면 삭제"}};
  $("#inf").onsubmit=async e=>{e.preventDefault();
    const d={};["source","org","pillar","urgency","need","govLink","ministry","date"].forEach(k=>d[k]=$("#i_"+k).value.trim());
    if(!isNew){d.taskId=i.taskId||null;d.example=!!i.example}
    $("#mMsg").textContent="저장 중…";
    try{await (isNew?db.collection("insights").doc():db.collection("insights").doc(i.id)).set(d);closeModal();toast("저장했습니다")}
    catch(err){$("#mMsg").textContent=err?.code==="invalid_argument"?"저장 권한이 없습니다.":"저장하지 못했습니다."}
  };
}

/* ---------- data ---------- */
function setSync(m){$("#sync").textContent=m}
/* 외부 공유판(GitHub Pages)용: claude 저장소가 없으면 내장 스냅샷 + 브라우저 저장 */
let LOCAL=false;
function makeLocalDb(SNAP){
  const KEY="policy-plan-store:"+(SNAP.asOf||"");const clone=o=>JSON.parse(JSON.stringify(o));
  let store=null;try{store=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!store)store=clone(SNAP.data||{});
  const subs=[];const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}subs.forEach(f=>f())};
  const meta={fromCache:false,hasPendingWrites:false};
  const snapDoc=(c,id)=>({id,exists:!!(store[c]&&store[c][id]),data:()=>store[c]&&store[c][id]?clone(store[c][id]):undefined,metadata:meta});
  const docRef=(c,id)=>({id,
    set:async d=>{(store[c]=store[c]||{})[id]=clone(d);save()},
    update:async d=>{if(!store[c]||!store[c][id])throw{code:"invalid_argument"};Object.assign(store[c][id],clone(d));save()},
    delete:async()=>{if(store[c])delete store[c][id];save()},
    onSnapshot:n=>{const f=()=>n(snapDoc(c,id));subs.push(f);setTimeout(f,0);return()=>{}}});
  const newId=()=>"l"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  return {
    collection:c=>({doc:id=>docRef(c,id||newId()),onSnapshot:n=>{const f=()=>{const docs=Object.keys(store[c]||{}).map(id=>snapDoc(c,id));n({docs,size:docs.length,empty:!docs.length,metadata:meta})};subs.push(f);setTimeout(f,0);return()=>{}}}),
    doc:p=>{const s=p.split("/");return docRef(s[0],s[1])},
    exportJSON:()=>JSON.stringify(store,null,1),
    reset:()=>{store=clone(SNAP.data||{});save()}};
}
function showLocalBar(SNAP){
  const bar=$("#localBar");if(!bar)return;bar.hidden=false;
  $("#localAsOf").textContent=SNAP.asOf||"";
  $("#lbCopy").onclick=()=>{const t=db.exportJSON();navigator.clipboard.writeText(t).then(()=>toast("변경 내용을 복사했습니다. Claude에게 붙여 넣으면 원본에 반영합니다.")).catch(()=>{$("#lbOut").hidden=false;$("#lbOut").value=t;$("#lbOut").select();toast("아래 칸의 내용을 직접 복사하세요.")})};
  const rb=$("#lbReset");rb.onclick=()=>{if(rb.dataset.armed){db.reset();rb.dataset.armed="";rb.textContent="기준 데이터로 되돌리기";toast("기준 데이터로 되돌렸습니다")}else{rb.dataset.armed=1;rb.textContent="한 번 더 누르면 되돌림"}};
}
render();
(async()=>{
  try{db=await window.claude?.use?.("db")}catch(e){db=null}
  try{sample=await window.claude?.use?.("sample")}catch(e){sample=null}
  if(!db&&window.PP_SNAPSHOT){db=makeLocalDb(window.PP_SNAPSHOT);LOCAL=true;showLocalBar(window.PP_SNAPSHOT)}
  if(!db){setSync("저장소 연결 안 됨");$("#view").innerHTML=`<div class="empty">이 화면에서는 저장된 업무계획을 불러올 수 없습니다. claude.ai에 로그인한 상태로 이 페이지를 열어 주세요.</div>`;$("#addTaskTop").disabled=true;return}
  const timer=setTimeout(()=>setSync("저장소 응답 지연 · 내용이 최신이 아닐 수 있음"),10000);
  const done=()=>{if(loaded.t&&loaded.i){clearTimeout(timer);setSync(LOCAL?"이 브라우저에 저장":"저장됨 · 실시간 공유")}};
  db.collection("tasks").onSnapshot(s=>{tasks=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache)loaded.t=true;done();if(!$("#ov"))render()},e=>{clearTimeout(timer);setSync("과제를 불러오지 못했습니다")});
  db.collection("programs").onSnapshot(s=>{programs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order??99)-(b.order??99));if(!$("#ov"))render()},()=>{});
  db.collection("env").onSnapshot(s=>{env=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order??99)-(b.order??99));if(!$("#ov"))render()},()=>{});
  db.doc("config/strategy").onSnapshot(s=>{pillars=(s.exists&&Array.isArray(s.data().pillars))?[...s.data().pillars]:[];if(!$("#ov"))render()},()=>{});
  db.collection("insights").onSnapshot(s=>{insights=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache)loaded.i=true;done();if(!$("#ov"))render()},e=>{clearTimeout(timer);setSync("인사이트를 불러오지 못했습니다")});
  setTab(location.hash.slice(1)||"overview");
})();
})();
</script>
