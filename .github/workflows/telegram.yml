name: 텔레그램 브리핑 전송
# 전송 순서: ① 금일 정부·국회 주요일정 → ② 이슈레이더 A4 이미지 → ③ 이슈레이더 링크
on:
  push:
    branches: [main]
    paths: ['telegram/latest-brief.txt', 'telegram/latest-schedule.txt']
  workflow_dispatch:
    inputs:
      send:
        description: 'yes = 채널로 전송, no = 이미지만 만들어 확인(전송 안 함)'
        required: false
        default: 'yes'
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: 새 날짜 리포트일 때만 자동 전송(같은 날 수정은 생략)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.send }}" = "no" ]; then echo "send=no" >> $GITHUB_OUTPUT; else echo "send=yes" >> $GITHUB_OUTPUT; fi
            echo "build=yes" >> $GITHUB_OUTPUT; exit 0; fi
          if [ "$(TZ=Asia/Seoul date +%u)" -ge 6 ]; then echo "주말(토·일) — 자동 전송 생략(11/11 사용자 요청). 필요하면 수동 실행"; echo "send=no" >> $GITHUB_OUTPUT; echo "build=no" >> $GITHUB_OUTPUT; exit 0; fi
          NEW=$(head -1 telegram/latest-brief.txt)
          OLD=$( (git show HEAD~1:telegram/latest-brief.txt 2>/dev/null || git show HEAD~1:docs/latest-brief.txt 2>/dev/null) | head -1 || true)
          if [ "$NEW" != "$OLD" ]; then echo "send=yes" >> $GITHUB_OUTPUT; echo "build=yes" >> $GITHUB_OUTPUT; else echo "같은 날짜 리포트 수정 — 전송 생략"; echo "send=no" >> $GITHUB_OUTPUT; fi
      - name: A4 이미지 만들기
        id: a4
        if: steps.guard.outputs.build == 'yes'
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
          npm i --no-save --silent playwright@1.47.2
          npx playwright install --with-deps chromium > /dev/null
          python3 telegram/a4.py
          node scripts/render_a4.js
          test -s telegram/a4/latest.png
      - name: 이미지 보관(Actions 결과물)
        if: steps.a4.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: issue-radar-a4
          path: telegram/a4/latest.png
          retention-days: 30
      - name: Send to Telegram
        if: steps.guard.outputs.send == 'yes'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID_EXTRA: ${{ secrets.TELEGRAM_CHAT_ID_EXTRA }}
        run: |
          python3 scripts/telegram_send.py telegram/latest-schedule.txt
          if [ "${{ steps.a4.outcome }}" = "success" ]; then
            python3 scripts/telegram_send_file.py telegram/a4/latest.png
            python3 scripts/telegram_send.py telegram/latest-link.txt
          else
            echo "A4 이미지 실패 — 기존 텍스트 브리핑으로 대체 전송"
            python3 scripts/telegram_send.py telegram/latest-brief.txt
          fi
