name: tmp probe korea.kr rss
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -m 30 -A "Mozilla/5.0" https://www.korea.kr/etc/rssService.do -o s.html || true
          grep -oE 'https?://[^"<> ]*\.xml[^"<> ]*|/rss/[^"<> ]*' s.html | sort -u | head -150
          grep -n -iE 'rss|보도자료' s.html | head -60
