name: tmp probe korea.kr rss
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -m 30 -A "Mozilla/5.0" "https://www.korea.kr/etc/noticeView.do?newsId=132038885" | sed 's/<[^>]*>//g' | grep -v '^\s*$' | grep -A15 -E 'RSS 서비스' | head -40
          echo =====LIST
          curl -sSL -m 30 -A "Mozilla/5.0" "https://www.korea.kr/briefing/pressReleaseList.do" -o l.html -w "%{http_code} %{size_download}\n"
          grep -n -E 'pressReleaseView|newsId=' l.html | head -20
          L=$(grep -n -m1 'pressReleaseView' l.html | cut -d: -f1); sed -n "$((L-5)),$((L+40))p" l.html
          grep -n -E 'pageIndex|srchRepCodeType|repCode' l.html | head -20
