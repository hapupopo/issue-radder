name: 키워드 기사 알림
on:
  schedule:
    - cron: '*/30 21-23,0-13 * * *'   # 한국시간 06:00~22:30, 30분마다
  workflow_dispatch:
concurrency: keyword-alerts
jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore seen-state
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: alerts-seen-${{ github.run_id }}
          restore-keys: alerts-seen-
      - name: Check keywords and send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/keyword_alerts.py
      - name: Save seen-state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: alerts-seen-${{ github.run_id }}
